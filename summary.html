<style>

*{box-sizing:border-box}
body{margin:0;padding:16px;background:var(--bg);color:var(--text);font-family:var(--font);font-size:16px;line-height:1.7}
.wrap{max-width:1600px;margin:0 auto}
h1{font-size:1.45rem;margin:0 0 4px}
.ver{font-size:.9rem;color:var(--muted);margin:0 0 12px}
p{margin:6px 0}
a{color:var(--link)}
a:focus,button:focus,select:focus,summary:focus,[tabindex]:focus{outline:3px solid var(--focus);outline-offset:2px}
.panel{border:1px solid var(--line);border-radius:8px;padding:10px 14px;margin:10px 0;background:var(--row-alt)}
.panel h2{font-size:1.05rem;margin:0 0 6px}
.ctl{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:6px 0}
.ctl .lab{font-weight:700;margin-right:2px}
button,select{font-family:var(--font);font-size:.95rem;padding:7px 12px;min-height:40px;border:1px solid var(--line);border-radius:6px;background:var(--btn-bg);color:var(--text);cursor:pointer}
button[aria-pressed="true"]{background:var(--btn-on);color:#fff;border-color:var(--btn-on);font-weight:700}
.unlock-btn{border:1.5px solid var(--focus);background:#fff;color:var(--focus);font-weight:700}
.status-ok{color:#1a7a3a;font-weight:700}
/* 口訣與展開 */
.mn{margin:2px 0 6px}
.mn .lbl{font-size:.85rem;color:var(--muted);display:block}
.mnl .lbl{display:inline-block;min-width:3.2em;margin-right:4px;font-size:.85rem;color:var(--muted)}
.mnl{margin:2px 0 4px}
td.c-mn{min-width:250px}
.mtext{color:var(--mn);background:var(--mn-bg);padding:0 4px;border-radius:4px;font-weight:700;font-size:1.05rem}
details{margin:2px 0}
summary{cursor:pointer;color:var(--link);font-size:.9rem;padding:4px 0;min-height:32px}
details ul,.plain{margin:2px 0 4px;padding-left:1.2em}
details li,.plain li{margin:1px 0}
.src{font-size:.78rem;color:var(--muted);white-space:nowrap}
.sub{font-weight:700;font-size:.88rem;margin-top:6px;display:block}
.issue{background:var(--warn-bg);border-left:4px solid #c77700;padding:2px 6px;margin:3px 0;font-size:.9rem;list-style:none}
.issues{padding-left:0;margin:4px 0}
.none{color:var(--muted)}
.locked{color:var(--muted);font-size:.9rem}
.lnk{display:inline-block;font-size:.88rem;margin-top:2px}
.meta{font-size:.85rem;color:var(--muted);display:block;font-weight:400}

.tbl-wrap{overflow:auto;max-height:85vh;border:1px solid var(--line);border-radius:8px}
table{border-collapse:collapse;width:100%}
caption{text-align:left;padding:8px 12px;font-weight:700;background:var(--head-bg);border-bottom:1px solid var(--line)}
th,td{border:1px solid var(--line);padding:6px 9px;vertical-align:top;font-size:.94rem;text-align:left}

.hide{display:none!important}
.cardnav{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:8px 0}

.cardnav .pos{font-weight:700}

.hint{font-size:.85rem;color:var(--muted)}
footer{margin-top:24px;padding-top:10px;border-top:1px solid var(--line);font-size:.86rem;color:var(--muted)}

.pwd-bg{display:none;position:fixed;inset:0;z-index:300;background:rgba(0,0,0,.65);align-items:center;justify-content:center;padding:20px}
.pwd-bg.open{display:flex}
.pwd{background:#fff;border-radius:14px;padding:22px;width:100%;max-width:360px}
.pwd h2{font-size:1.1rem;margin:0 0 6px}
.pwd input{width:100%;padding:12px;border-radius:8px;border:1.5px solid #999;font-size:1rem;margin:6px 0 10px}
.pwd button{width:100%;margin-top:6px}
.pwd .go{background:#1e5799;color:#fff;font-weight:700;border:none}
.err{color:#b00020;font-weight:700;font-size:.9rem}
@media (max-width:820px){body{padding:10px}}
</style>
</head>

"src": "重"}, "purpose": {"type": "通用", "extra": null, "src": "重"}, "cautions": {"type": "通用+補充", "extra": ["切記一定要說：棘上棘間韌帶損傷，禁止做旋腰椎和曲膝曲髖運動法（重）", "治療原則以緩解疼痛、減緩腰部肌肉緊張與痙攣為主；患部劇烈疼痛時切忌在患部施壓揉等手法，應從周圍軟組織開始施術（規+講）"], "src": "重+規+講"}, "extra_sections": [{"label": "急性腰扭傷三種類型（概述）", "items": ["腰部肌肉筋膜損傷", "棘上、棘間韌帶損傷", "腰椎小關節紊亂（滑膜嵌頓）", "本題必須先設定為肌肉筋膜損傷及主痛部位（最好設L4、L5）"], "src": "重"}, {"label": "三型體位與壓痛（規範版）", "items": ["肌肉型：兩側豎脊肌損傷時，疼痛一側因保護性痙攣而肌肉緊繃變硬；右側損傷者出現向右再向後的體徵", "棘上韌帶：輕壓督脈各穴有痛感", "棘間韌帶：重壓督脈各穴有痛感", "韌帶型受傷體位：體位向後，無法順利往前彎腰", "滑膜嵌頓（後關節囊損傷）：受傷體位向前，無法順利做挺腰動作"], "src": "規"}, {"label": "腰部肌肉功能（規範版）", "items": ["腰方肌：與左右側屈有關", "橫突間肌：與左右旋轉有關", "腹直肌和髂腰肌：與向前屈曲有關", "豎脊肌：與向後伸展有關"], "src": "規"}], "issues": ["考試不用說：急性病症分急性期、慢性期、恢復期", "棘上棘間韌帶損傷一定要說：禁旋腰椎和曲膝曲髖運動法"], "stepsMain": ["(1) 俯臥，做臀至下肢後側，加強委中。", "(2) 輕柔手法從遠端向主痛部位。", "(3) 做腰臀及下肢的壓痛點。", "(4) 取穴。", "(5) 再做腰臀下肢，強擦豎棘肌。", "(6) 側臥施旋腰運動(患側在上)，仰臥施雙下肢屈膝屈髖(韌帶型不適用)。"], "stepsMainSrc": "重", "stepsSpec": ["(一) 被術者採俯臥位，先以誘導按摩揉捏、按壓臀部至下肢後側肌群，並加強委中穴。", "(二) 用輕柔的揉捏、按壓病變的豎脊肌遠端，再逐漸向主痛部位移進，重複數次。", "(三) 揉捏、按壓腰臀部及下肢的壓痛點。", "(四) 揉捏、按壓腎俞、志室、大腸俞、胞肓、秩邊、環跳、委中、承山、足臨泣、崑崙、陽陵泉等穴。", "(五) 以姆指或掌根揉捏兩側豎脊肌及下肢，再沿豎脊肌的纖維走向，用掌根強擦， 以熱透為宜。", "(六) 被術者改側臥位，患側在上，施旋腰運動，再採仰臥位施雙下肢的屈膝屈髖運動（韌帶型不適用）。"], "pet": {"num": "02", "positions": ["俯臥", "側臥", "仰臥"], "pillow": [], "exercises": [{"text": "旋腰運動（側臥，患側在上）", "src": "重+規"}, {"text": "雙下肢屈膝屈髖運動（仰臥，韌帶型不適用）", "src": "重+規"}, {"text": "滑膜嵌頓之運動法：醫者與患者背靠背，兩肘套住肘彎，背起患者兩足離地，以骶部抵患處牽引後快速伸膝挺臀並顫動或搖動腰部", "src": "講"}], "tests": [], "note": "重點版與規範版一致。講義註有滑膜嵌頓運動法。無獨立測試節；規範說明韌帶型：輕壓督脈各穴有痛感為棘上韌帶、重壓有痛感為棘間韌帶（屬分型徵象，未列入tests）。"}, "cat": "關節損傷", "name": "腰肌急性扭傷之按摩", "acu": 11, "steps": 6, "hasTeacher": true}, {"num": "03", "etiology": [{"label": "病因口訣", "mnemonic": "勞姿反先骨", "items": ["勞、姿：姿勢或勞動", "反：反覆腰傷", "先：先天因素（肌力不平衡導致活動失衡，日久勞損）", "骨：骨折"], "note": "原文只列3項（姿勢或勞動／反覆腰傷／先天因素或骨折），「勞姿」合一項、「先骨」合一項，無法逐字完全對齊", "src": "重"}], "etiology_summary": null, "people": {"text": "長期從事彎腰工作的體力勞動者（例如農夫）和腰肌力量薄弱者；中、高年齡為多", "src": "重+規"}, "timing": {"mnemonic": "晨反久勞天", "items": ["晨：晨起或久坐， s": ["內高外低：骨頭", "內緊外鬆：關節囊", "內強外弱：韌帶"], "src": "重"}, {"label": "內翻扭傷較常見原因", "items": ["內高外低", "前比三強：脛骨前肌比第三腓骨肌強壯有力，內翻力量比外翻力量強"], "src": "重"}, {"label": "外翻骨折原因", "items": ["內踝短外踝長（腓骨骨折）"], "src": "重"}, {"label": "韌帶損傷順序", "items": ["無論內翻外翻損傷，都會先傷到前距腓韌帶，接下來才傷到跟腓韌帶"], "src": "重"}], "issues": ["規範版：本法僅適用單純韌帶扭傷或部分纖維撕裂、關節穩定者，骨折、完全斷裂不適用"], "stepsMain": ["(1) 仰臥，檢測瞭解發炎部位與狀況。", "(2) 做扭傷部位的上下關節附近，由小腿外側至外踝誘導按摩，解谿、崑崙、丘墟。", "(3) 急性期，做患部周圍，施輕度搖法。", "(4) 足三里、陽陵泉、陽輔、懸鐘。", "(5) 輕擦踝部至小腿熱透。", "(6) 做牽引法，再做搖法。"], "stepsMainSrc": "重", "stepsSpec": ["(一) 被術者採仰臥位，由足背與足外側往膝蓋，利用拇指或手掌往上做輕觸檢測， 以瞭解發炎部位與發炎狀況。", "(二) 揉捏、按壓扭傷部位的上下關節附近，由小腿外側至外踝，施以誘導按摩手法，重複數次。接著配合輕巧靈活地揉捏解谿、崑崙、丘墟等穴。", "(三) 急性期時，可用輕柔而緩和地揉捏法施在損傷的患部周圍，如果疼痛稍減， 即可施輕度的踝關節搖法。", "(四) 揉捏、按壓足三里、陽陵泉、陽輔、懸鐘等穴。", "(五) 輕擦踝部至小腿部，以熱透為宜。", "(六) 一手托足跟，另一手握住腳背做牽引法，接著再做踝關節的搖法。"], "pet": {"num": "10", "positions": ["仰臥"], "pillow": [], "exercises": [{"text": "踝關節輕度搖法（急性期，疼痛稍減後）", "src": "重+規"}, {"text": "牽引法後再做踝關節搖法（一手托足跟，另一手握腳背）", "src": "重+規"}, {"text": "講義補充：握足趾向上牽引，先外翻再內翻，食、拇指夾持踝關節，內外翻各1~2次，再背伸蹠屈並下推上提兩踝", "src": "講"}], "tests": [{"text": "輕觸檢測：由足背與足外側往膝蓋，用拇指或手掌往上輕觸，瞭解發炎部位與發炎狀況", "src": "重+規"}], "note": "無墊枕。檢測的判定標準原文未寫。"}, "cat": "關節損傷", "name": "踝關節急性扭傷之按摩", "acu": 7, "steps": 6, "hasTeacher": true}, {"num": "11", "etiology": [{"label": "病因口訣", "mnemonic": "外勞內佔先炎", "items": ["外：創傷，踝關節反覆扭傷，造成肌腱發炎", "勞：勞損，骨刺增生", "內：內分泌障礙，例如糖尿病、甲狀腺功能低下、妊娠婦女為好發族群", "佔：佔位性病變，如腱鞘囊腫、脂肪瘤、靜脈曲張", "先：先天上解剖異常，如扁平足、外展拇肌肥大", "炎：炎症，如腱鞘炎、神經炎、類風濕性關節炎、痛風"], "note": null, "src": "重"}], "etiology_summary": null, "people": {"text": "好發於青壯年男性，多為體力勞動者；或長跑運動員（稱「慢跑者足」）；糖尿病患者、妊娠婦女為好發族群", "src": "重+講"}, "timing": {"mnemonic": "晨彎久勞天", "items": ["晨：晨輕夜重", "彎：蹠屈背屈加重", "久：久立久行加重，脫鞋減輕", "勞：勞累加重", "天：天氣變化加重"], "note": "原文「晨」寫晨輕夜重，與口訣字面略有出入，照原文列", "src": "重"}, "location": {"text": "一般呈單側；內踝後下方踝管處，放射至足底或小腿", "src": "重+規"}, "symptoms": {"mnemonic": "酸感運夜手", "items": ["酸：酸脹麻木，早期內踝後方出現酸脹不適", "感：感覺障礙，中期足底內側皮膚發白、發涼、麻木加重", "運：運動障礙，晚期足底肌肉萎縮、肌肉功能喪失", "夜：夜間疼痛加重；行走站立加重，休息後減輕", "手：脛神經為勾狀外翻足"], "note": "另有：酸脹痛 ry": null, "people": {"text": "16~40歲；男性較多，男女比例約2.5~5：1；10~16歲為幼年型僵直性脊椎炎", "src": "重"}, "timing": {"mnemonic": "晨彎久勞天", "items": ["晨：晨起發僵", "彎：彎腰、伸直酸痛", "久：不能久坐", "勞：勞累加重", "天：寒冷加重"], "note": null, "src": "重"}, "location": {"text": "最初在骶髂關節下1/3處；延脊柱向上蔓延至頸部；30%患者波及四肢關節，但極少影響遠端小關節；20%患有虹膜炎", "src": "重"}, "symptoms": {"mnemonic": null, "items": ["酸痛僵直：病程長達十餘年，延脊柱向上發展", "前期：腰骶不適，反覆腰部酸痛，腰背部有僵直感，不能久坐", "後期：腰段彎曲消失，胸段明顯後凸，胸廓扁平，又因各肋椎關節僵硬，整個脊柱和下肢成強硬的弓形駝背", "麻木：偶有間歇或交替出現放射性坐骨神經痛", "功能受限：腰部及下肢活動不靈活"], "src": "重"}, "anatomy": {"mnemonic": null, "mnemonic_items": [], "items": ["關節：脊椎上下小關節、椎體關節、椎間盤、肋椎關節、肋橫突關節、骶髂關節、恥骨聯合、髖關節、膝關節", "韌帶：脊柱周圍的韌帶", "肌腱：附著在脊柱周圍的肌腱"], "src": "重"}, "purpose": {"type": "通用", "extra": null, "src": "重"}, "cautions": {"type": "通用", "extra": null, "src": "重"}, "extra_sections": [{"label": "穴位", "items": ["髀關、伏兔、梁丘、風市、血海、膝眼、鶴頂、陽陵泉、足三里、崑崙、解谿"], "src": "重"}, {"label": "別名", "items": ["強直性、僵直性、上行性、畸形性、竹竿病", "侵犯脊椎的慢性風濕炎症，伴隨關節疼痛和強直症狀"], "src": "重"}], "issues": ["講義版解剖有一行「半多轉，棘最髂」無解釋，疑為口訣，建議向老師確認", "規範版提醒：骨性強直後復健無效，手法以柔克剛、切忌粗暴"], "stepsMain": ["(一) 俯臥，上胸墊枕。", "(二) 做膀胱經，由大杼到秩邊；做督脈，由大椎至骶骨。", "(三) 做兩側骶髂關節。", "(四) 做臀、大、小腿後側。", "(五) 腰、腰骶、骶髂、髖，做背伸運動。", "(六) 強擦背、腰、臀的督脈和膀胱經與骶髂關節。", "(七) 挺胸壓脊法。", "(八) 仰臥，髖關節前部、大腿內側，做髖關節外展、外旋運動。", "(九) 膝關節：", "①大腿前側、小腿外側至足背，重點在膝關節。", "②配合膝關節的按壓與被動運動。", "③髀關、伏兔、梁丘、風市、血海、膝眼、鶴頂、陽陵泉、足三里、崑崙、解谿。", "(十) 頸椎：", "①坐姿，項韌帶、頸部、肩上部、肩胛肩部。", "②施頸部被動運動。", "(十一) 擴胸運動。"], "stepsMainSrc": "重", "stepsSpec": ["(一) 被術者採俯臥位，上胸部墊枕，用於弓形背者。", "(二) 揉捏、按壓背部兩側膀胱經，由大柱向下至秩邊；並施在督脈，由大椎向下至骶骨，重複數次。", "(三) 揉捏兩側骶髂關節，重複數次。", "(四) 揉捏、按壓臀部經大腿後側、膕窩、小腿後側，重複數次。", "(五) 在腰、腰骶、骶髂和髖部，做背伸的被動運動。", "(六) 掌根強擦背、腰、臀的督脈和膀胱經路線與骶髂關節部，以熱透為宜。", "(七) 在脊椎兩側，做挺胸壓脊法。", "(八) 被術者採仰臥位，揉捏髖關節前部和大腿內側肌群，重複數次，並配合髖關節外展、外旋的被動運動。", "(九) 如有累及膝關節者： 揉捏大腿前側，經膝關節、小腿外側至足背，重複數次。重點在膝關節。 配合膝關節的按壓與被動運動。 拇指揉捏、按壓髀關、伏兔、梁丘、風市、血海、膝眼、鶴頂、陽陵泉、足三里、崑崙、解谿等穴。", "(十) 如病情累及頸椎者： 被術者採坐姿，揉捏、按壓項韌帶、頸椎兩側斜方肌、兩側頸部、肩上部、肩胛間部。 施頸部被動運動。", "(十一) 被術者兩手十指交叉，置於後枕部，施擴胸運動。"], "pet": {"num": "14", "positions": ["俯臥", "仰臥", "坐姿"], "pillow": [{"text": "上胸部墊枕（步驟 : ["主要表現為垂腕", "高位損傷（肱三頭肌分支以上）：完全性麻痹，肘、腕、掌指關節皆不能伸直，前臂不能旋後", "肱橈肌癱瘓：前臂於半旋前位不能屈肘，握力減低", "受損節段愈低，保留伸肌功能愈多，症狀愈輕微；接近腕部的損傷可不產生麻痹症狀", "規範：拇指無法伸直和外展、拇指內收；知覺障礙以虎口區較厲害；有時伴手臂腫脹、發涼、發紫"], "src": "重+規"}, "anatomy": {"mnemonic": null, "mnemonic_items": [], "items": ["神經來源：臂叢後側束，主含 C5 至 C7 神經纖維（C8、T1 較少）", "走向：經腋窩後面繞肱骨後方橈神經溝下行，越肱骨外上髁前方進入前臂，於肱橈關節分淺支與深支", "淺支：司前臂及手背橈側皮膚感覺", "深支（前臂背側骨間神經）：穿旋後肌，支配前臂伸肌群", "近端肌支：支配肱三頭肌、肱橈肌等", "規範：肱骨下段肌支支配肘肌、部分肱肌、肱橈肌、橈側伸腕長肌；淺支肌支支配橈側伸腕短肌；深支支配旋後肌、伸指總肌、伸小指肌、尺側伸腕肌、外展姆長肌、伸姆短肌、伸姆長肌、伸食指肌"], "src": "重+規"}, "purpose": {"type": "專屬", "extra": ["初期：消除患肢血腫、水腫，促進炎症吸收，減輕橈神經溝周圍組織對神經的壓迫", "後期：增加局部血液循環，改善組織營養代謝", "配合腕、指關節被動運動與伸肌肌力訓練，恢復伸腕、伸指功能，減輕垂腕及手背橈側感覺障礙", "防止肌肉萎縮與關節攣縮"], "src": "重"}, "cautions": {"type": "專屬", "extra": ["預後多良好：單純神經壓迫且無合併骨折或神經構造缺損者，通常不需特別治療，多數四至六週內明顯恢復，三個月內近乎痊癒", "症狀較重者需復健：正確擺位防止再受壓迫及手部變形，關節運動或穿戴支架防攣縮，訓練伸腕伸指功能；恢復遲緩或惡化才考慮外科治療", "急性期應休息，避免過多活動，攝取富含營養與維生素B群的飲食"], "src": "重"}, "extra_sections": [{"label": "概述", "items": ["橈神經損傷是上肢中第三常見的單一神經損傷", "成因分兩類：外傷、長時間壓迫"], "src": "重"}, {"label": "講義：損傷部位與表現", "items": ["肱骨中1/3處發出肱三頭肌分支以下受損：肱三頭肌功能完好", "損傷肱骨下端或前臂上1/3：肱橈肌、旋後肌、手腕肌功能保存", "前臂中1/3以下損傷：僅伸指癱瘓而無垂腕"], "src": "講"}, {"label": "穴位口訣第1組", "mnemonic": "柱池友窗頂，井宗氣盆", "items": ["天柱、風池、天牖、天窗、天鼎、肩井、天宗、氣舍、缺盆"], "src": "重"}, {"label": "穴位口訣第2組", "mnemonic": "極臂井曲三", "items": ["極泉、臂臑、天井、曲池、手三里"], "src": "重"}, {"label": "穴位口訣第3組", "mnemonic": "列經太魚合", "items": ["列缺、經渠、太淵、魚際、合谷"], "src": "重"}, {"label": "穴位口訣第4組", "mnemonic": "偏溫三外陽養", "items": ["偏歷、溫溜、三陽絡、外關、陽池、養老"], "src": "重"}], "issues": ["感覺障礙範圍：重點版寫手背拇指與第一、二掌骨間隙，規範版寫虎口區較嚴重", "病因：規範版另列肩關節脫臼、不當藥物注射、佔位性病變等，口訣以重點版為準"], "num": "27", "stepsMain": ["(一) 側臥，輕擦、揉捏、按壓放鬆頸項兩側、鎖骨上窩、肩胛及上肢肌群，重點按壓頸胸棘突旁軟組織。", "(二) 揉捏、按壓天柱、風池、天牖、天窗、天鼎、肩井、天宗、氣舍、缺盆。", "(三) 揉捏、按壓肱三頭肌、橈神經溝、極泉穴及臂神經叢，再按壓臂臑、天井、曲池、手三里、列缺、經渠、太淵、魚際、合谷、偏歷、溫溜、三陽絡、外關、陽池、養老。", "(四) 掌背推擦揉捏掌骨縫，夾壓各手指。", "(五) 上肢各關節迴旋、牽引、抖搖，強擦麻痺肌群，熱透為宜。"], "stepsMainSrc": "重", "stepsSpec": ["(一) 被術者採側臥位，先用輕擦、揉捏、按壓法放鬆頸項兩側、鎖骨上窩、肩胛肩部及上肢各肌群，重點揉捏、按壓頸四至胸三棘突旁的軟組織。力量由輕到重，重複數次。揉捏、按壓到主要部位肌肉感到酸脹為宜。", "(二) 揉捏、按壓天柱、風池、天 、聽宮、聽會、翳風、頰車、大迎達口輪匝肌處，以輕擦結束。", "如在頰車、大迎有明顯的痛點，可能累及第三支。"], "stepsMainSrc": "重", "stepsSpec": ["(一) 被術者採側臥位，輕擦、揉捏手指至上臂、肩部、背部，施以向心性誘導按摩。", "(二) 被術者採仰臥位，輕擦、揉捏、按壓睛明、攢竹、魚腰、絲竹空至瞳子髎， 再由魚腰經陽白至本神，接著由印堂上推至神庭，最後以輕擦法結束。如在攢竹、魚腰或陽白穴有較明顯的壓痛點，則可能累及第一支。", "(三) 輕擦、揉捏、按壓四白、巨髎、顴髎、迎香、水溝，再從懸厘經頜厭至頭維， 最後以輕擦法結束。如在四白、顴髎穴有較明顯的痛點，則可能累及第二支。", "(四) 輕擦、揉捏、按壓下關、耳門、聽宮、聽會、翳風、頰車、大迎達口輪匝肌 處，最後以輕擦結束。如在頰車、大迎有明顯的痛點，則可能累及第三支。"], "pet": {"num": "33", "positions": ["側臥", "仰臥"], "pillow": [], "exercises": [], "tests": [{"text": "攢竹、魚腰、陽白有較明顯壓痛點：可能累及第一支", "src": "重+規"}, {"text": "四白、顴髎有明顯痛點：可能累及第二支", "src": "重+規"}, {"text": "頰車、大迎有明顯痛點：可能累及第三支", "src": "重+規"}], "note": "這三項是施術中以壓痛點判斷累及分支，原文沒有另列試驗名稱。無墊枕、運動法。"}, "cat": "神經痛", "name": "三叉神經痛之按摩", "acu": 24, "steps": 4, "hasTeacher": true}, {"num": "34", "etiology": [{"label": "病因口訣", "mnemonic": "外毒內佔先炎", "items": ["外：肋骨外傷，如撞擊", "毒：病毒（如傷寒、流感、帶狀疱疹）；毒物（如酒精、藥物中毒）", "內：內臟疾病（如肺炎、肺結核、胃病、肝臟病等，肺胃肝）；內分泌障礙（如糖尿病）", "佔：佔位性病變，如腫瘤", "先：先天性，如漏斗胸、雞胸", "炎：例如僵直性脊椎炎、胸椎硬脊髓膜炎"], "note": "分類：原發性（罕見）、繼發性。備註：這題也屬綜合症，可套用腕踝管的病因口訣（外勞內佔先炎），把勞改成毒（包含病毒和中毒）；神經類題型的病因口訣（外勞內佔壓炎）也可套用，若用壓字，可解釋成異物壓迫；內包含內分泌和內臟；所謂先天性就是原發性，例如胸椎脊髓病變，非常罕見", "src": "重"}], "etiology_summary": null, "people": {"text": "多見20~40歲中青年女性，老年人也常見", "src": "重"}, "timing": {"mnemonic": null, "items": ["持續性或陣發性", "深吸氣、咳嗽、打噴嚏、活動時，疼痛加劇"], "note": null, "src": "重"}, "location": {"text": "單側（多見）或雙側的肋間分佈區；由背部向腹部（由後向前）呈半環形放射痛；1~3肋會擴散到上臂；8~12肋常併發腹痛", "src": "重"}, "symptoms": {"mnemonic": null, "items": ["刺痛、灼痛、放射痛", "相應皮膚的感覺障礙", "相應肌肉的活動障礙"], "src": "重"}, "anatomy": {"mnemonic": null, "mnemonic_items": [], "items": ["神經：肋間神經為胸肋神經的前支，共12對，沿肋間隙分布", "第1~6對肋間神經：支配肋間肌和胸前外側壁的皮膚", "第7~12對肋間神經：支配腹前外側壁的肌肉和皮膚"], "src": "重"}, "purpose": null, "cautions": {"type": "專屬", "extra": ["第一到第三的肋間神經痛會擴散到上臂；第八到第十二的肋間神經痛常併發腹部作痛", "按摩前，若由全身性或局部性疾患引發，應針對治本入手；略告好轉後，肋間尚遺留若干疼痛，或純由肋間神經自發的症狀，才進行按摩"], "src": "規"}, "extra_sections": [{"label": "概述", "items": ["肋間神經受到刺激或壓迫，導致由背部向腹部沿肋骨走向出現疼痛的綜合症"], "src": "重"}], "issues": ["考試不要照規範說：規範把遺傳列為全身性病因，但肋間神經痛沒有遺傳性", "考試不要照規範說：8~12肋痛併發腹痛「被誤認胃腸疾患」，上腹臟器痛由內臟神經傳導，與肋間神經腹壁痛不同", "重點版沒有施術目的與注意事項，cautions 取自規範版，請向老師確認", "穴位：講義版多一個支溝，重點版與規範版沒有"], "stepsMain": ["(1) 側臥，患側在上，在下肢施輕擦、揉捏之誘導按摩。", "(2) 擦揉膀胱經，從風門、肺俞、厥陰俞、心俞、膈俞、肝俞、膽俞至脾俞。", "(共8個穴位)", "(3) 揉肩部及上肢肌群，按肩井、缺盆、內關、外關、合谷。", "(共5個穴位)", "(4) 仰臥，雙手四指朝外，由胸骨沿肋間向外輕擦。", "(5) 揉按胸部肋間和腹部，再按壓期門、日月、章門、膻中，再以手掌輕拍及輕擦。", "(共4個穴位)", "(6) 坐姿或側臥，施肩關節、肘關節運動，配合按住肋間做推扳運動。"], "stepsMainSrc": "重", "stepsSpec": ["(一) 被術者採側臥位，患側在上，在下肢施輕擦、揉捏之誘導按摩。", "(二) 手掌輕擦、揉捏背部膀胱經，從風門、肺俞、厥陰俞、心俞、膈俞、肝俞、膽俞至脾俞。", "(三) 揉捏肩部及上肢肌群，重點在肩井和缺盆兩穴。接著按壓內關、外關和合谷等穴。", "(四) 被術者採仰臥位，雙手四指朝外，由胸骨沿肋間向外輕擦。", "(五) 揉捏、按壓胸部肋間和腹部，再按壓期門、日月、章門及膻中穴，並施以手掌輕拍及輕擦手法。", "(六) 被術者採坐姿或側臥位，施上肢肩關節及肘關節運動，接著配合按住肋間做推扳 運動。"], "pet": {"num": "34", "positions": ["側臥", "仰臥", "坐姿"], "pillow": [], "exercises": [{"text": "肩關節、肘關節運動（坐姿或側臥）", "src": "重+規"}, {"text": "配合按住肋間做推扳運動", "src": "重+規"}], "tests": [{"text": "壓痛點檢查：沿相應肋骨緣壓痛，常見脊椎點（脊柱旁）、外側點（腋線上）、前點（胸骨和肋軟骨聯合線上）", "src": "講"}], "note": "測試只在講義版體徵及檢查。無墊枕。"}, "cat": "神經痛", "name": "肋間神經痛之按摩", "acu": 17, "steps": 6, "hasTeacher": true}, {"num": "35", "etiology": [{"label": "病因口訣", "mnemonic": "內退外傷寒", "items": ["內：內因", "退：椎間盤退行性改變", "外：外因", "傷：急、慢性損傷", "寒：風寒濕邪"], "note": "備註（口述可不說）：講義中的內因提到解剖學上的弱點，是指纖維環後外側較薄弱、後縱韌帶在腰骶部變窄", "src": "重"}, {"label": "病理", "mnemonic": null, "items": ["纖維環破裂、髓核突出，刺激或壓迫神經根，導致神經根水腫、沾連", "可伴有腰臀部筋肉代償性損傷"], "note": "原文無口訣", "src": "重"}], "etiology_summary": null, "people": {"text": "好發於20~45歲的體力勞動者；有明顯外傷史、過勞或受涼史者；男性多於女性", "src": "重+規"}, "timing": {"mnemonic": "晨彎久勞天", "items": ["晨：晨輕傍晚重", "彎：前屈或後伸疼痛明顯", "久：久立久行加重", "勞：勞累加重，休息減輕", "天：天冷受涼加重"], "note": "原文另有「咳嗽、打噴嚏時加重」，不在口訣內", "src": "重"}, "location": {"text": "壓痛點多位於L4、L5及L5、S1棘突旁開約2公分處，按壓時常伴有下肢放射痛", "src": "重"}, "symptoms": {"mnemonic": null, "items": ["酸痛麻木：腰部鈍痛，伴隨單側或雙側下肢沿坐骨神經徑路（臀部、大腿後側、小腿外側）放射性疼痛或麻木", "功能受限：腰部活動受限，以前屈或後伸明顯", "屈膝屈髖或臥床休息可緩解"], "src": "重"}, "anatomy": {"mnemonic": null, "mnemonic_items": [], "items": ["椎間盤：位於兩椎體之間，由髓核、纖維環和軟骨板三部分組成", "功能：連接椎體、穩固脊柱、維持高度、緩衝震盪，並使脊柱兼具穩定性與靈活性", "韌帶：後縱韌帶在腰骶部逐漸變窄", "薄弱環節：纖維環後方較前方薄，加上後縱韌帶在腰骶部逐漸變窄，椎間盤最容易向後外側突出", "神經：突出處正是神經根必經的椎間孔，極易壓迫神經根"], "src": "重"}, "purpose": {"type": "通用", "extra": null, "src": "重"}, "cautions": {"type": "通用", "extra": null, "src": "重"}, "extra_sections": [{"label": "概述", "items": ["椎間盤變性、纖維環破裂，導致髓核向後外側或正後方突出，壓迫脊神經根或馬尾神經，引發下腰部疼痛及下肢坐骨神經痛等症狀"], "src": "重"}, {"label": "測試檢查", "items": ["直腿抬高試驗", "節段定位測試"], "src": "重"}, {"label": "直腿抬高試驗（備註，口述不用說）", "items": ["仰臥，下肢伸直被動抬高；正常約可達70-80度，若小於60-70度即出現下肢放射痛為陽性，角度越小通常表示壓迫越嚴重", "抬高超過30度以後即可引起神經根牽拉或向下移動，受牽拉最大的是腰5神經根，其次是腰4神經根；抬高超過60度，腰5神經根所受拉力達最大", "腰5-骶1、腰4-5椎間盤突出的患者，直腿抬高試驗多為陽性", "較嚴重者，連健側的直腿抬高試驗也可以為陽性"], "src": "重"}, {"label": "節段定位（肌力測試，備註）", "items": ["L4-L5椎間盤突出：檢查者下壓患者雙側拇指背側，囑患者用力上翹；患側上翹力量減弱或無力，多指向此節段病變", "L5-S1椎間盤突出：檢查者頂住患者雙側拇指腹側，囑患者用力下屈；患側下屈力量減弱或無力，多指向此節段病變"], "src": "重+規"}], "issues": ["直腿抬高試驗角度：重點版寫小於60-70度陽性，規範版低於60度，講義版45度以下，請向老師確認考試說法"], "stepsMain": ["(一) 俯臥，輕擦、揉捏、按壓腰部的兩側，經臀、大、小腿至跟腱。(下肢只做患側)", "(二) 腹前墊枕，使腰後伸，按壓腎俞、大腸俞、環跳、居髎、承扶、殷門、委中、承山、崑崙9個穴位。雙掌重疊壓督脈(從第十一胸椎到尾骨)。", "(三) 側臥，做旋腰運動。", "(四) 仰臥，做患肢大腿前、外側和小腿外側及足背。", "(五) 掌根揉按大腿外側和小腿外側，繼之作直腿抬高運動。", "(六) 按壓風市、陽陵泉、解谿、委中、承山、崑崙6個穴位，雙掌搓揉下肢，熱透為宜。"], "stepsMainSrc": "重", "stepsSpec": ["(一) 被術者採俯臥位，輕擦、揉捏、按壓腰部的兩側，沿著膀胱經，經臀部、大腿、小腿至跟腱，重複數次（大、小腿只做患側）。", "(二) 在腹部前墊枕頭，使腰部後伸，拇指重點按壓腎俞、大腸俞、環跳、居髎、承扶、殷門、委中、承山、崑崙等穴，重複數次。繼以雙掌重疊掌壓從第十一胸椎以下的正中線到尾骨，重複數次。", "(三) 被術者採側臥位，做旋腰運動。", "(四) 被術者採仰臥位，揉捏、按壓患肢的大腿前側和外側、小腿外側及足背，重複數次。", "(五) 掌根揉捏、按壓大腿外側和小腿外側，繼之作直腿抬高運動，重複數次。", "(六) 拇指揉捏、按壓風市、陽陵泉、解谿、委中、承山、崑崙等穴，最後雙掌搓揉下肢，以熱透為宜。"], "pet": {"num": "35", "positions": ["俯臥", "側臥", "仰臥"], "pillow": [{"text": "腹前墊枕，使腰後伸（按壓腎俞等9穴與掌壓督脈時，步驟(二)）", "src": "重+規"}], "exercises": [{"text": "旋腰運動（側臥）", "src": "重+規"}, {"text": "直腿抬高運動（仰臥，掌根揉按大腿、小腿外側後）", "src": "重+規"}], "tests": [{"text": "直腿抬高試驗：仰臥，下肢伸直被動抬高，正常約70-80度，小於60-70度出現下肢放射痛為陽性，角度越小通常壓迫越嚴重（規範版寫低於60度，再高舉有劇痛）", "src": "重+規"}, {"text": "節段定位測試（肌力測試）L4-L5：檢查者下壓患者雙側拇指背側，囑用力上翹，患側力量減弱或無力指向L4-L5", "src": "重+規"}, {"text": "節段定位測試（肌力測試）L5-S1：檢查者頂住雙側拇指腹側，囑用力下屈，患側力量減弱或無力指向L5-S1", "src": "重+規"}, {"text": "其他（講義版）：神經根牽張試驗（直腿抬高在45度以下疼痛、扳頸壓胸試驗、屈曲試驗）、神經根擠壓試驗（挺腹閉氣試驗、挺腹咳嗽徵、隔掌擊頂試驗）", "src": "講"}], "note": "重點版備註標示測試細節「口述不用說」。直腿抬高試驗（測試）與直腿抬高運動（步驟）是兩件事，分開列。"}, "cat": "神經痛", "name": "坐骨神經痛（腰椎間盤突出）之按摩", "acu": 12, "steps": 6, "hasTeacher": true}, {"num": "36", "etiology": [{"label": "病因口訣", "mnemonic": "外勞風先炎", "items": ["外：外傷拉傷，例如下蹲位時大腿迅速外旋站立", "勞：勞損，經常彎腰直立或大腿外旋內旋", "風：風寒濕邪侵襲，肌肉收縮，壓迫坐骨神經", "先：先天變異，少數人的坐骨神經穿過梨狀肌肌腹", "炎：炎症，周圍組織發炎，使神經根受壓，繼發梨狀肌痙攣，產生坐骨神經痛"], "note": null, "src": "重"}], "etiology_summary": null, "people": {"text": "先天梨狀肌變異者；經常久坐或下蹲者；曾有外傷史", "src": "重"}, "timing": {"mnemonic": "夜x久勞天", "items": ["夜：夜晚加重（臀部受壓）", "久：久坐久行加重", "勞：勞累加重，休息減輕", "天：寒冷加重"], "note": "原文口訣寫成「夜x久勞天」，中間的「x」沒有對應項目，原文只列四項（夜、久、勞、寒冷），已照原文順序列出，建議向老師確認", "src": "重"}, "location": {"text": "臀部深層；下肢後側或後外側；嚴重者膝踝反射減弱、肌肉萎縮", "src": "重"}, "symptoms": {"mnemonic": null, "items": ["酸痛麻木：臀部深層酸痛痙攣，向下肢後側或後外側放射痛，偶有麻木現象", "功能受限：髖關節活動不利，跛行，自覺患肢變短"], "src": "重"}, "anatomy": {"mnemonic": null, "mnemonic_items": [], "items": ["肌肉：梨狀肌，起於2~4骶前孔外側，止於股骨大轉子，主要功能為股骨外旋", "位置：梨狀肌在中層，體表投影在2~4骶骨外緣到大轉子，狀似西洋梨", "神經：坐骨神經在臀部會通過梨狀肌下方，但部分人解剖變異，會穿入梨狀肌肌肉層或被梨狀肌分為上下兩束"], "src": "重"}, "purpose": {"type": "通用", "extra": null, "src": "重"}, "cautions": {"type": "通用", "extra": null, "src": "重"}, "extra_sections": [{"label": "概述", "items": ["梨狀肌局部損傷，進而壓迫坐骨神經，導致相應的臨床症狀，稱為梨狀肌綜合征"], "src": "重"}, {"label": "測試檢查（規範版）", "items": ["直腿抬高試驗：低於60度即感疼痛為坐骨神經痛；再將下肢內旋，疼痛加劇，則合併有梨狀肌病變", "俯臥、患肢屈膝，一手按患側臀部，另一手握踝關節向外扳，使髖關節產生內旋，坐骨神經疼痛加重", "患側下肢膝、踝反射減弱或消失，皮膚知覺減退，肌力減弱和肌肉萎縮"], "src": "規"}, {"label": "講義補充", "items": ["梨狀肌受第1、2骶神經支配", "講義：梨狀肌有使大腿外展及外旋的功能", "講義：坐骨神經總幹從梨狀肌下孔出盆腔者佔61.6%（正常型），穿過梨狀肌等變異佔38.4%"], "src": "講"}], "issues": ["timing 口訣「夜x久勞天」中間的「x」原文沒有對應項目，只列四項，請向老師確認", "梨狀肌功能：重點版只寫股骨外旋，講義版寫外展及外旋，以重點版為主", "規範的直腿抬高試驗屬坐骨神經損傷試驗，不一定是梨狀肌造成；講義版指出梨狀肌緊張試驗陽性才是梨狀肌綜合征的測試"], "stepsMain": ["(1) 俯臥，做臀部和大轉子周圍，重點在大轉子後缘；", "再按壓骶骨外緣、臀部和大轉子周圍。", "(2) 彈撥大轉子周圍，做髖關節內旋。", "(3) 做下肢膀胱經至足跟。", "按壓胞肓、秩邊、環跳、居髎、承扶、殷門、委中、承山、崑崙。", "(4) 仰臥，做患側下肢前側、外側到足背。", "(5) 做直腿抬高運動，按壓風市、陽陵泉、解谿、委中、承山、崑崙。", "(6) 側臥，沿梨狀肌走向強擦。"], "stepsMainSrc": "重", "stepsSpec": ["(一) 被術者採俯臥位，先以掌根揉捏臀部肌群和大轉子周圍，重點在大轉子後缘； 再以拇指按壓骶骨外緣、臀部肌群和大轉子周圍，重複數次。", "(二) 拇指彈撥患側大轉子周圍，並配合做髖關節的內旋運動。", "(三) 揉捏、按壓下肢後側的膀胱經路線至足跟，重複數次。接著揉捏、按壓胞肓、秩邊、環跳、居髎、承扶、殷門、委中、承山、崑崙等穴。", "(四) 被術者採仰臥位，揉捏、按壓患側下肢前側及外側到足背，重複數次。", "(五) 做直腿抬高運動數次，接著按壓風市、陽陵泉、解谿、委中、承山和崑崙等穴。", "(六) 被術者採側臥位，沿梨狀肌走向施強擦手法，以熱透為宜。"], "pet": {"num": "36", "positions": ["俯臥", "仰臥", "側臥"], "pillow": [], "exercises": [{"text": "髖關節內旋運動（俯臥，彈撥大轉子周圍時配合）", "src": "重+規"}, {"text": "直腿抬高運動（仰臥）", "src": "重+規"}], "tests": [{"text": "直腿抬高試驗：患側直腿抬高低於60度疼痛為坐骨神經痛，再將下肢內旋疼痛加重則合併梨狀肌病變", "src": "規+講"}, {"text": "俯臥屈膝髖內旋扳試驗：俯臥、患肢屈膝，一手按患側臀部，另一手握踝向外扳使髖（講義寫踝）內旋，坐骨神經疼痛加重", "src": "規+講"}, {"text": "梨狀肌緊張試驗：仰臥患肢伸直，髖主動內收內旋時臀及大腿後側痛，再迅速主動外旋外展疼痛緩解為陽性，提示梨狀肌綜合征", "src": "講"}], "note": "重點版沒有檢查節，測試取自規範版與講義版。講義備註指出直腿抬高試驗是坐骨神經損傷試驗，不一定是梨狀肌造成，梨狀肌緊張試驗陽性才是測試梨狀肌綜合征的正確方法。規範版寫「髖關節內旋」、講義版寫「踝關節內旋」，用字不同。"}, "cat": "神經痛", "name": "神經痛（梨狀肌病變）之按摩", "acu": 12, "steps": 6, "hasTeacher": true}, {"num": "37", "etiology": [{"label": "病因口訣", "mnemonic": "高姿風扭挑", "items": ["高：枕頭過高", "姿：睡眠時姿勢不良", "風：感受風寒", "扭：頸部突然扭轉", "挑：肩挑重物不當"], "note": "原文解釋的順序是姿、高、風、扭、挑，已依口訣字序對齊", "src": "重"}], "etiology_summary": null, "people": {"text": "任何年齡層；中年以後反覆落枕，可能是頸椎病的前兆", "src": "重"}, "timing": {"mnemonic": null, "items": ["活動疼痛加重", "輕者1~2天休息後可自癒；重者數週不癒"], "note": null, "src": "重"}, "location": {"text": "多數以一側提肩胛肌、胸鎖乳突肌或斜方肌局部疼痛，也可累及兩側；嚴重者可波及上背部、枕部、肩背部", "src": "重"}, "symptoms": {"mnemonic": "痙痛僵滯", "items": ["痙：頸部肌肉痙攣", "痛：疼痛", "僵：僵硬", "滯：板滯"], "note": "功能受限：頭偏向一側，頸部旋轉尤為困難", "src": "重"}, "anatomy": {"mnemonic": null, "mnemonic_items": [], "items": ["肌肉：提肩胛肌", "肌肉：胸鎖乳突肌", "肌肉：斜方肌"], "src": "重"}, "purpose": {"type": "通用", "extra": null, "src": "重"}, "cautions": {"type": "通用", "extra": null, "src": "重"}, "extra_sections": [{"label": "概述", "items": ["又稱失枕，由於睡眠姿勢不良或風寒受涼而引起頸部肌肉酸痛、痙攣、強直，以致頸部功能障礙的一種疾患"], "src": "重"}, {"label": "備註（口述不用說）", "items": ["講義敘述頭歪向患側，基本上沒錯，因教科書描述肌肉拉力方向會寫歪向患側（肌肉收縮）", "教科書的「歪」是頭頂倒的方向為患側；實際上是「轉」，即下巴轉的方向為健側"], "src": "重"}, {"label": "肌肉起止（講義，僅供補充）", "items": ["   var h='<span class="sub">'+name+(o?src(o.src):'')+'</span>';
  if(!o)return h+none();
  if(o.type==='專屬')return h+'<div>本題專屬（不用通用口訣）</div>'+ul(o.extra);
  h+='<div class="mn"><strong class="mtext">'+esc(g.short)+'</strong>'+det(g.lines,'展開通用口訣')+'</div>';
  if(o.type==='通用+補充'&&o.extra&&o.extra.length)h+='<div>本題另加：</div>'+ul(o.extra);
  return h;
}
function cPC(t){return pcPart('施術目的',t.purpose,GEN.purpose)+pcPart('注意事項',t.cautions,GEN.cautions);}
function cNT(t){
  var h='';
  (t.extra_sections||[]).forEach(function(x){if(!SY_RE.test(x.label))h+=exOne(x);});
  if(t.issues&&t.issues.length)h+='<details><summary>⚠ 待向老師確認（'+t.issues.length+' 項）</summary><ul class="issues">'+t.issues.map(function(i){return '<li class="issue">'+esc(i)+'</li>';}).join('')+'</ul></details>';
  return h||none();
}
function ol(items){if(!items||!items.length)return'';return '<ol class="plain steps">'+items.map(function(i){return '<li>'+esc(i)+'</li>';}).join('')+'</ol>';}
function cST(t){
  if(!t.stepsMain||!t.stepsMain.length)return none();
  var h='<span class="sub">'+(t.stepsMainSrc==='重'?'重點整理版':'規範版')+'・'+t.stepsMain.length+' 步</span>'+ol(t.stepsMain);
  if(t.stepsSpec&&t.stepsSpec.length)h+='<details><summary>展開規範版步驟（'+t.stepsSpec.length+' 步）</summary>'+ol(t.stepsSpec)+'</details>';
  return h;
}
function peList(name,arr){
  if(!arr||!arr.length)return '';
  return '<span class="sub">'+name+'</span><ul class="plain">'+arr.map(function(x){return '<li>'+esc(x.text)+src(x.src)+'</li>';}).join('')+'</ul>';
}
function cPE(t){
  var p=t.pet; if(!p)return '<span class="none">盤點中</span>';
  var h='';
  if(p.positions&&p.positions.length)h+='<span class="sub">體位</span><div>'+esc(p.positions.join('→'))+'</div>';
  h+=peList('墊枕',p.pillow)+peList('運動法',p.exercises)+peList('測試',p.tests);
  if(!h)return none();
  if(p.note)h+='<details><summary>⚠ 版本差異</summary><p>'+esc(p.note)+'</p></details>';
  return h;
}
function cMN(t){
  var L=[];
  function add(lab,m,items,note){lab=lab||'口訣';if(m)L.push('<div class="mn mnl"><span class="lbl">'+esc(lab)+'</span><strong class="mtext">'+esc(m)+'</strong>'+det((items||[]).concat(note?['註：'+note]:[]))+'</div>');}
  (t.etiology||[]).forEach(function(e){add((e.label||'').replace('口訣','')||'病因',e.mnemonic,e.items,e.note);});
  if(t.timing)add('事時',t.timing.mnemonic,t.timing.items,t.timing.note);
  if(t.symptoms)add('症狀',t.symptoms.mnemonic,t.symptoms.items,t.symptoms.note);
  if(t.anatomy)add('解剖',t.anatomy.mnemonic,t.anatomy.mnemonic_items,null);
  (t.extra_sections||[]).forEach(function(x){add(x.label.replace(/口訣/,''),x.mnemonic,x.items,null);});
  var sp=[];
  if(t.purpose&&t.purpose.type==='專屬')sp.push('施術目的');
  if(t.cautions&&t.cautions.type==='專屬')sp.push('注意事項');
  if(sp.length)L.push('<div class="mnl"><span class="lbl">注意</span>'+sp.join('、')+'不用通用口訣（見「施術目的／注意事項」欄）</div>');
  return L.join('')||'<span class="none">本題沒有專屬口訣</span>';
}
function cCL(t){
  var a=cRS(t),b=cSY(t),dash=none();
  var h=(a===dash?'':a);
  if(b!==dash)h+='<span class="sub">症狀</span>'+b;
  return h||dash;
}
var CELL={cl:cCL,mn:cMN,st:cST,pe:cPE,et:cET,rs:cRS,sy:cSY,an:cAN,pc:cPC,nt:cNT};
function cell(k,t){
  if(!unlocked)return '<span class="locked">需輸入密碼</span>';
  if(!t.etiology&&!t.symptoms)return '<span class="none">本題資料整理中</span>';
  return CELL[k](t);
}
function link(t){return '<a class="lnk" href="index.html#topic-'+t.num+'">前往第 '+t.num+' 題完整內容</a>';}
function metaLine(t){return esc(t.cat)+'・'+t.acu+' 穴・'+t.steps+' 步';}

var GEN={};
function prepGen(){
  ['purpose','cautions'].forEach(function(k){
    var g=DATA.general[k]; var lines=g.text.split('\n').filter(function(x){return x.trim();});
    GEN[k]={short:lines[0],lines:lines.slice(1),title:g.title};
  });
  var b='';
  ['purpose','cautions'].forEach(function(k){b+='<p><strong>'+esc(GEN[k].title)+'</strong>：'+(unlocked?'<span class="mtext">'+esc(GEN[k].short)+'</span>':'需輸入密碼')+'</p>'+(unlocked?ul(GEN[k].lines):'');});
  document.getElementById('genBox').innerHTML=b;
}

var KEY={et:1,cl:1,pe:1,an:1};
function visibleCols(){return COLS.filter(function(c){return col==='all'||(col==='key'&&KEY[c.k])||c.k===col;});}
function renderTable(){
  var cs=visibleCols();
  var h='<div class="tbl-wrap" tabindex="0" role="region" aria-label="比對表，可捲動"><table><caption id="cap">40 題比對表：'+(cs.length+1)+' 欄、'+DATA.topics.length+' 列</caption><thead><tr><th scope="col">題號與題名</th>';
  cs.forEach(function(c){h+='<th scope="col">'+c.h+'</th>';});
  h+='</tr></thead><tbody>';
  DATA.topics.forEach(function(t){
    h+='<tr id="row-'+t.num+'"><th scope="row" tabindex="-1">'+t.num+'　'+esc(t.name)+'<span class="meta">'+metaLine(t)+'</span>'+link(t)+'</th>';
    cs.forEach(function(c){h+='<td class="c-'+c.k+'">'+cell(c.k,t)+'</td>';});
    h+='</tr>';
  });
  return h+'</tbody></table></div>';
}
var cur=parseInt(ls('summaryCard')||'0',10)||0;
function renderCards(){
  var cs=visibleCols(), N=DATA.topics.length;
  if(cur<0||cur>=N)cur=0;
  var t=DATA.topics[cur];
  var nav='<nav class="cardnav" aria-label="換題"><button type="button" onclick="goCard(-1)"'+(cur===0?' disabled':'')+'>◀ 上一題</button><span class="pos" aria-hidden="true">'+(cur+1)+' / '+N+'</span><button type="button" onclick="goCard(1)"'+(cur===N-1?' disabled':'')+'>下一題 ▶</button></nav>';
  var h='<div class="cards" id="cardsBox">'+nav;
  h+='<article class="card" id="card-'+t.num+'"><h2 tabindex="-1">第 '+t.num+' 題　'+esc(t.name)+'</h2><span class="meta">'+metaLine(t)+'</span>';
  h+='<a class="openbtn" href="index.html#topic-'+t.num+'">打開第 '+t.num+' 題完整內容</a>';
  cs.forEach(function(c){h+='<h3>'+c.h+'</h3><div>'+cell(c.k,t)+'</div>';});
  h+='</article>'+nav.replace('aria-label="換題"','aria-label="換題（下方）"')+'<p class="hint">手機可左右滑換題（開報讀時 TalkBack 兩指、旁白三指）。</p></div>';
  return h;
}
function goCard(d){
  var N=DATA.topics.length, n=cur+d;
  if(n<0||n>=N)return;
  cur=n; ls('summaryCard',String(cur)); render();
  var h=document.querySelector('#cardsBox h2'); if(h){h.scrollIntoView({block:'start'});h.focus();}
}
function effLayout(){if(layout!=='auto')return layout;return window.matchMedia('(max-width: 820px)').matches?'cards':'table';}
function render(){
  prepGen();renderQuick();
  var L=effLayout();
  document.getElementById('view').innerHTML=(L==='table')?renderTable():renderCards();
  if(allOpen)setDetails(true);
  document.querySelectorAll('[data-layout]').forEach(function(b){b.setAttribute('aria-pressed',b.getAttribute('data-layout')===layout?'true':'false');});
  document.querySelectorAll('[data-col]').forEach(function(b){b.setAttribute('aria-pressed',b.getAttribute('data-col')===col?'true':'false');});
  var lp=document.getElementById('lockPanel');
  if(unlocked){document.getElementById('lockMsg').innerHTML='<span class="status-ok">已解鎖</span>，口訣與重點內容都已顯示。';document.getElementById('unlockBtn').classList.add('hide');}
}
function setLayout(v){layout=v;ls('summaryLayout',v);render();}
function setCol(v){col=v;render();}
function setDetails(open){document.querySelectorAll('#view details').forEach(function(d){d.open=open;});}
function toggleAll(){allOpen=!allOpen;setDetails(allOpen);var b=document.getElementById('expandBtn');b.textContent=allOpen?'全部收合解釋':'全部展開解釋';}
function jumpTo(n){
  if(!n)return;
  if(effLayout()==='cards'){
    for(var i=0;i<DATA.topics.length;i++)if(DATA.topics[i].num===n){cur=i-0;}
    goCard(0);document.getElementById('jump').value='';return;
  }
  var el=document.querySelector('#row-'+n+' th, #card-'+n+' h2');
  if(el){el.scrollIntoView({block:'start'});el.focus();}
}
function openPwd(){document.getElementById('pwdBg').classList.add('open');document.getElementById('pwdIn').value='';document.getElementById('pwdErr').classList.add('hide');setTimeout(function(){document.getElementById('pwdIn').focus();},30);}
function closePwd(){document.getElementById('pwdBg').classList.remove('open');document.getElementById('unlockBtn').focus();}
async function sha(s){var b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));return Array.from(new Uint8Array(b)).map(function(x){return x.toString(16).padStart(2,'0');}).join('');}
async function submitPwd(){
  var e=document.getElementById('pwdErr');
  if(fails>=3){e.textContent='錯誤太多次，請重新整理頁面再試。';e.classList.remove('hide');return;}
  if(await sha(document.getElementById('pwdIn').value)===HASH){
    unlocked=true;ls('massageExamAuth',HASH);document.getElementById('pwdBg').classList.remove('open');render();
    var m=document.getElementById('lockMsg');m.setAttribute('tabindex','-1');m.focus();
  }else{fails++;e.textContent='密碼不正確';e.classList.remove('hide');document.getElementById('pwdIn').value='';document.getElementById('pwdIn').focus();}
}
document.addEventListener('keydown',function(e){if(e.key==='Escape'&&document.getElementById('pwdBg').classList.contains('open'))closePwd();});
// 左右滑換題（沿用主頁 v63 手勢）：單指只認左右滑；TalkBack 兩指／旁白三指也可；
// 上下滑不攔；兩指張開縮放、螢幕邊緣返回手勢、選取文字中都不換題。往左滑＝下一題。
(function(){
  var startX=0,startY=0,startN=0,tracking=false,MIN=45,EDGE=20,fStart={},fLast={};
  function active(){return effLayout()==='cards'&&!document.getElementById('pwdBg').classList.contains('open');}
  function sameDir(){var sign=0;for(var k in fStart){if(!fLast[k])continue;var d=fLast[k].x-fStart[k].x;if(Math.abs(d)<MIN/2)return false;var sg=d<0?-1:1;if(sign&&sg!==sign)return false;sign=sg;}return sign!==0;}
  document.addEventListener('touchstart',function(e){
    tracking=false;if(!active())return;
    var t=e.target.tagName;if(t==='INPUT'||t==='SELECT'||t==='TEXTAREA')return;
    startN=e.touches.length;startX=e.touches[0].clientX;startY=e.touches[0].clientY;fStart={};fLast={};
    for(var i=0;i<e.touches.length;i++){var q=e.touches[i];fStart[q.identifier]=fLast[q.identifier]={x:q.clientX,y:q.clientY};}
    if(startN===1&&(startX<EDGE||startX>window.innerWidth-EDGE))return;
    tracking=true;
  },{passive:true});
  document.addEventListener('touchmove',function(e){
    if(!tracking)return;if(e.touches.length>startN)startN=e.touches.length;
    for(var i=0;i<e.touches.length;i++){var q=e.touches[i];if(!fStart[q.identifier])fStart[q.identifier]={x:q.clientX,y:q.clientY};fLast[q.identifier]={x:q.clientX,y:q.clientY};}
    if(startN>=2&&sameDir()){var dx=e.touches[0].clientX-startX,dy=e.touches[0].clientY-startY;if(Math.abs(dx)>MIN&&Math.abs(dx)>Math.abs(dy)&&e.cancelable)e.preventDefault();}
  },{passive:false});
  document.addEventListener('touchend',function(e){
    if(!tracking)return;
    if(e.changedTouches)for(var j=0;j<e.changedTouches.length;j++){var c=e.changedTouches[j];fLast[c.identifier]={x:c.clientX,y:c.clientY};}
    if(e.touches&&e.touches.length>0)return;
    tracking=false;if(!active())return;
    var endT=e.changedTouches&&e.changedTouches[0];if(!endT)return;
    var dx=endT.clientX-startX,dy=endT.clientY-startY,ax=Math.abs(dx),ay=Math.abs(dy);
    var sel=window.getSelection?window.getSelection().toString():'';if(sel)return;
    if(ax<MIN||ax<ay)return;if(startN>=2&&!sameDir())return;
    goCard(dx<0?1:-1);
  },{passive:true});
  // 鍵盤左右鍵換題（卡片版面；焦點在輸入框、下拉選單或按著修飾鍵時不攔）
  document.addEventListener('keydown',function(e){
    if(e.key!=='ArrowLeft'&&e.key!=='ArrowRight')return;
    if(e.altKey||e.ctrlKey||e.metaKey||e.shiftKey||e.defaultPrevented||!active())return;
    var t=e.target;if(t&&(t.tagName==='INPUT'||t.tagName==='SELECT'||t.tagName==='TEXTAREA'||t.isContentEditable))return;
    e.preventDefault();goCard(e.key==='ArrowRight'?1:-1);
  });
})();
(function init(){
  var g=document.querySelector('[aria-label="只看哪一欄"]');
  COLS.forEach(function(c){var b=document.createElement('button');b.type='button';b.setAttribute('data-col',c.k);b.textContent=c.h;b.onclick=function(){setCol(c.k);};g.appendChild(b);});
  var j=document.getElementById('jump');
  DATA.topics.forEach(function(t){var o=document.createElement('option');o.value=t.num;o.textContent=t.num+' '+t.name;j.appendChild(o);});
  window.matchMedia('(max-width: 820px)').addEventListener('change',function(){if(layout==='auto')render();});
  render();
  if('serviceWorker' in navigator){
    navigator.serviceWorker.register('sw.js').then(function(){return navigator.serviceWorker.ready;})
      .then(function(){showOffline();})
      .catch(function(){setOM('這個瀏覽器無法存到裝置，需要網路才能開。');document.getElementById('saveBtn').classList.add('hide');});
  }else{setOM('這個瀏覽器不支援離線存檔，需要網路才能開。');document.getElementById('saveBtn').classList.add('hide');}
  window.addEventListener('offline',function(){setOM('目前沒有網路，正在使用存在這台裝置的版本。');});
})();
function setOM(s){document.getElementById('offlineMsg').textContent=s;}
function showOffline(){
  var t=ls('summarySavedAt');
  setOM(navigator.onLine?('已存到這台裝置'+(t?'（上次存檔 '+t+'）':'')+'，斷線也能打開本頁和主頁 40 題頁。'):'目前沒有網路，正在使用存在這台裝置的版本。');
}
function saveOffline(){
  var b=document.getElementById('saveBtn');
  if(!window.caches){setOM('這個瀏覽器不支援離線存檔。');return;}
  if(!navigator.onLine){setOM('目前沒有網路，無法更新存檔；裝置裡的舊存檔仍可使用。');return;}
  b.disabled=true;setOM('存檔中…');
  caches.open('massage-exam-offline-v1').then(function(c){
    return Promise.all(['summary.html','index.html','./'].map(function(u){
      return fetch(u,{cache:'reload'}).then(function(r){if(!r.ok)throw new Error(u);return c.put(u,r);});
    }));
  }).then(function(){
    var d=new Date(),p=function(n){return ('0'+n).slice(-2);};
    ls('summarySavedAt',(d.getMonth()+1)+'/'+d.getDate()+' '+p(d.getHours())+':'+p(d.getMinutes()));
    showOffline();
  }).catch(function(){setOM('存檔失敗，請確認網路後再按一次。');}).then(function(){b.disabled=false;});
}
function renderQuick(){
  var q=document.getElementById('quickPanel');
  if(!unlocked){q.classList.add('hide');return;}
  q.classList.remove('hide');
  function pick(k){return DATA.topics.filter(function(t){return t.pet&&t.pet[k]&&t.pet[k].length;});}
  function line(name,arr,k,open){
    var body='<ul class="plain">'+arr.map(function(t){return '<li><strong>'+t.num+' '+esc(t.name.replace(/之按摩$/,''))+'</strong>：'+t.pet[k].map(function(x){return esc(x.text);}).join('；')+'</li>';}).join('')+'</ul>';
    return '<details'+(open?' open':'')+'><summary>'+name+'</summary>'+body+'</details>';
  }
  q.innerHTML='<h2>快速比對</h2>'+line('墊枕',pick('pillow'),'pillow',true)+line('測試／檢查',pick('tests'),'tests',false)+line('運動法',pick('exercises'),'exercises',false);
}
</script>
