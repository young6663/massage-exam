button,select{font-family:var(--font);font-size:.95rem;padding:7px 12px;min-height:40px;border:1px solid var(--line);border-radius:6px;background:var(--btn-bg);color:var(--text);cursor:pointer}

.status-ok{color:#1a7a3a;font-weight:700}

.acnames{margin:2px 0;line-height:1.8}
.mtext{color:var(--mn);background:var(--mn-bg);padding:0 4px;border-radius:4px;font-weight:700;font-size:1.05rem}

summary{cursor:pointer;color:var(--link);font-size:.9rem;padding:4px 0;min-height:32px}
details ul,.plain{margin:2px 0 4px;padding-left:1.2em}
details li,.plain li{margin:1px 0}
.src{font-size:.78rem;color:var(--muted);white-space:nowrap}
.sub{font-weight:700;font-size:.88rem;margin-top:6px;display:block}
.issue{background:var(--warn-bg);border-left:4px solid #c77700;padding:2px 6px;margin:3px 0;font-size:.9rem;list-style:none}
.issues{padding-left:0;margin:4px 0}
.none{color:var(--muted)}
.locked{color:var(--muted);font-size:.9rem}
.lnk{display:inline-block;font-size:.88rem;margin-top:2px}
.meta{font-size:.85rem;color:var(--muted);display:block;font-weight:400}

table{border-collapse:collapse;width:100%}
caption{text-align:left;padding:8px 12px;font-weight:700;background:var(--head-bg);border-bottom:1px solid var(--line)}
th,td{border:1px solid var(--line);padding:6px 9px;vertical-align:top;font-size:.94rem;text-align:left}

.card.snap{transition:transform .15s ease-out,opacity .15s ease-out}

@media (max-width:820px){body{padding:10px}}
</style>

  (t.extra_sections||[]).forEach(function(x){add(x.label.replace(/口訣/,''),x.mnemonic,x.items,null);});
  var sp=[];
  if(t.purpose&&t.purpose.type==='專屬')sp.push('施術目的');
  if(t.cautions&&t.cautions.type==='專屬')sp.push('注意事項');
  if(sp.length)L.push('<div class="mnl"><span class="lbl">注意</span>'+sp.join('、')+'不用通用口訣（見「施術目的／注意事項」欄）</div>');
  return L.join('')||'<span class="none">無</span>';
}
function cCL(t){
  var a=cRS(t),b=cSY(t),dash=none();
  var h=(a===dash?'':a);
  if(b!==dash)h+='<span class="sub">症狀</span>'+b;
  h+=exAt(t,'cl');
  return h||dash;
}
function cAC(t){
  var a=t.acuInfo; if(!a)return none();
  var hasN=a.notes&&a.notes.length;
  var h='<div><strong>'+esc((a.summary||'').replace(/^共\s*/,'').replace(/\s+/g,'').replace(/。$/,''))+'</strong></div>';
  a.groups.forEach(function(g){
    var names=g.pts.map(function(p){return esc(p.n);}).join('、');
    if(g.label){var m=g.label.replace(/^第(\d)組口訣：/,'第$1組 ');h+='<div class="mn mnl"><span class="lbl">'+esc(m.split(' ')[0])+'</span><strong class="mtext">'+esc(m.split(' ').slice(1).join(' ')||g.label)+'</strong><div>'+names+'</div></div>';}
    else if(!hasN)h+='<div class="acnames">'+names+'</div>';
  });
  if(a.notes&&a.notes.length)h+=ul(a.notes);
  var locs=[];a.groups.forEach(function(g){g.pts.forEach(function(p){if(p.loc)locs.push(p.n+'：'+p.loc);});});
  if(locs.length)h+=det(locs,'定位');
  if(a.mismatch)h+='<div class="issue">'+esc(a.mismatch)+(a.notes&&a.notes.length?'':'，問老師')+'</div>';
  return h;
}
var CELL={ov:cOV,ac:cAC,cl:cCL,mn:cMN,pe:cPE,et:cET,rs:cRS,sy:cSY,an:cAN,pc:cPC,nt:cNT};
function cell(k,t){
  if(!unlocked)return '<span class="locked">需輸入密碼</span>';
  if(!t.etiology&&!t.symptoms)return '<span class="none">本題資料整理中</span>';
  return CELL[k](t);
}
function link(t){return '<a class="lnk" href="index.html#topic-'+t.num+'">前往第 '+t.num+' 題完整內容</a>';}
function sn(t){return t.name.replace(/之按摩$/,'');}
function metaLine(t){return esc(t.cat)+'・'+t.acu+' 穴・'+t.steps+' 步';}

var GEN={};
function prepGen(){
  ['purpose','cautions'].forEach(function(k){
    var g=DATA.general[k]; var lines=g.text.split('\n').filter(function(x){return x.trim();});
    GEN[k]={short:lines[0],lines:lines.slice(1),title:g.title};
  });
  var b='';
  ['purpose','cautions'].forEach(function(k){b+='<p><strong>'+esc(GEN[k].title)+'</strong>：'+(unlocked?'<span class="mtext">'+esc(GEN[k].short)+'</span>':'需輸入密碼')+'</p>'+(unlocked?ul(GEN[k].lines):'');});
  document.getElementById('genBox').innerHTML=b;
}

var KEY={ac:1,pe:1,ov:1,et:1,cl:1,an:1,pc:1};
function visibleCols(){return COLS.filter(function(c){return col==='all'||(col==='key'&&KEY[c.k])||c.k===col;});}
function renderTable(){
  var cs=visibleCols();
  var h='<div class="tbl-wrap" tabindex="0" role="region" aria-label="比對表"><table><caption id="cap">比對表</caption><thead><tr><th scope="col">題目</th>';
  cs.forEach(function(c){h+='<th scope="col">'+c.h+'</th>';});
  h+='</tr></thead><tbody>';
  list().forEach(function(t){
    h+='<tr id="row-'+t.num+'"><th scope="row" tabindex="-1"><a href="index.html#topic-'+t.num+'">'+t.num+' '+esc(sn(t))+'</a></th>';
    cs.forEach(function(c){h+='<td class="c-'+c.k+'">'+cell(c.k,t)+'</td>';});
    h+='</tr>';
  });
  h+='</tbody></table></div>';
  if(pins.length)h+='<p><button type="button" onclick="clearPins()">看全部 40 題</button></p>';
  return h;
}
var cur=parseInt(ls('summaryCard')||'0',10)||0;
// 釘選（抽到的兩題）：有釘選時表格與卡片都只顯示釘選的題目，左右滑只在這兩題之間切換
var pins=[],pcur=0;
try{localStorage.removeItem('summaryPins');}catch(e){}  // 清掉舊版存在手機裡的釘選
function topicOf(n){for(var i=0;i<DATA.topics.length;i++)if(DATA.topics[i].num===n)return DATA.topics[i];return null;}
function idxOf(n){for(var i=0;i<DATA.topics.length;i++)if(DATA.topics[i].num===n)return i;return 0;}
if(!Array.isArray(pins))pins=[];
pins=pins.filter(function(n){return typeof n==='string'&&topicOf(n);}).slice(0,2);
function list(){return pins.length?pins.map(topicOf):DATA.topics;}
function getCur(){var N=list().length,c=pins.length?pcur:cur;if(!(c>=0&&c<N))c=0;return c;}
function setCur(c){if(pins.length)pcur=c;else{cur=c;ls('summaryCard',String(c));}}
function canGo(d){var N=list().length;if(N<2)return false;if(pins.length===2)return true;var n=getCur()+d;return n>=0&&n<N;}
function fullHref(t){return pins.length===2?('index.html#topics='+pins.join(',')+'&at='+t.num):('index.html#topic-'+t.num);}
function cardBar(L,c,sticky){
  var N=L.length,cls=sticky?'cardbar':'cardnav';
  if(pins.length===2){
    return '<nav class="'+cls+'" aria-label="釘選的兩題">'+L.map(function(t,i){return '<button type="button" aria-pressed="'+(i===c?'true':'false')+'" onclick="showCard('+i+','+(i>c?1:-1)+')">'+t.num+' '+esc(sn(t))+'</button>';}).join('')+'</nav>';
  }
  if(N<2)return '';
  return '<nav class="'+cls+'" aria-label="換題"><button type="button" onclick="goCard(-1)"'+(c===0?' disabled':'')+'><span aria-hidden="true">◀ </span>上一題</button><span class="pos" aria-hidden="true">'+(c+1)+' / '+N+'</span><button type="button" onclick="goCard(1)"'+(c===N-1?' disabled':'')+'>下一題<span aria-hidden="true"> ▶</span></button></nav>';
}
function renderCards(){
  var cs=visibleCols(), L=list(), c=getCur(), t=L[c];
  var pinned=pins.indexOf(t.num)>=0;
  var h='<div class="cards" id="cardsBox">'+cardBar(L,c,true);
  h+='<div class="cardclip"><article class="card" id="card-'+t.num+'"><h2 tabindex="-1">'+t.num+' '+esc(sn(t))+'</h2>';
  h+='<div class="cardtools"><a class="openbtn" href="'+fullHref(t)+'">完整內容</a></div>';
  cs.forEach(function(k){h+='<h3>'+k.h+'</h3><div>'+cell(k.k,t)+'</div>';});
  h+='</article></div>'+cardBar(L,c,false);
  if(pins.length)h+='<p><button type="button" onclick="clearPins()">看全部 40 題</button></p>';
  return h+'</div>';
}
function renderView(){
  var L=effLayout();
  document.getElementById('view').innerHTML=(L==='table')?renderTable():renderCards();
  if(allOpen)setDetails(true);
}
function focusCard(dir){
  var box=document.getElementById('cardsBox');if(!box)return;
  var a=box.querySelector('.card');if(a&&dir)a.classList.add(dir>0?'inR':'inL');
  var top=box.getBoundingClientRect().top;if(top<0)window.scrollBy(0,top);
  var h=box.querySelector('h2');if(h){try{h.focus({preventScroll:true});}catch(e){h.focus();}}
}
function showCard(i,dir){setCur(i);renderView();focusCard(dir);}
function goCard(d){
  var N=list().length,n=getCur()+d;
  if(pins.length===2)n=(n+N)%N;else if(n<0||n>=N)return;
  showCard(n,d);
}
// v59：抽題功能已移除；釘選兩題只在這一次開啟有效（從主頁「看快速卡」帶進來），不再存進手機
function savePins(){}
function renderPins(){
  var v=document.getElementById('view'),anchor=document.getElementById('dispPanel');
  if(anchor.nextElementSibling!==v)anchor.parentNode.insertBefore(v,anchor.nextSibling);
}
function clearPins(){
  if(!pins.length)return;
  var n=list()[getCur()].num;pins=[];cur=idxOf(n);ls('summaryCard',String(cur));render();
  if(effLayout()==='cards')focusCard(0);else{var th=document.querySelector('#view tbody th');if(th){th.scrollIntoView({block:'center'});th.focus();}}
}
function effLayout(){if(layout!=='auto')return layout;return window.matchMedia('(max-width: 820px)').matches?'cards':'table';}
function render(){
  prepGen();renderQuick();renderPins();renderView();
  document.querySelectorAll('[data-layout]').forEach(function(b){b.setAttribute('aria-pressed',b.getAttribute('data-layout')===layout?'true':'false');});
  document.querySelectorAll('[data-col]').forEach(function(b){b.setAttribute('aria-pressed',b.getAttribute('data-col')===col?'true':'false');});
  var lp=document.getElementById('lockPanel');
  if(unlocked){document.getElementById('lockPanel').classList.add('hide');document.getElementById('unlockBtn').classList.add('hide');}
}
function setLayout(v){layout=v;ls('summaryLayout',v);render();}
function setCol(v){col=v;render();}
function setDetails(open){document.querySelectorAll('#view details').forEach(function(d){d.open=open;});}
function toggleAll(){allOpen=!allOpen;setDetails(allOpen);var b=document.getElementById('expandBtn');b.textContent=allOpen?'全部收合':'全部展開';}
function jumpTo(n){
  if(!n)return;
  if(pins.length&&pins.indexOf(n)<0){pins=[];savePins();render();}
  if(effLayout()==='cards'){
    if(pins.length)pcur=pins.indexOf(n);else cur=idxOf(n);
    showCard(getCur(),0);document.getElementById('jump').value='';return;
  }
  var el=document.querySelector('#row-'+n+' th, #card-'+n+' h2');
  if(el){el.scrollIntoView({block:'start'});el.focus();}
}
function openPwd(){document.getElementById('pwdBg').classList.add('open');document.getElementById('pwdIn').value='';document.getElementById('pwdErr').classList.add('hide');setTimeout(function(){document.getElementById('pwdIn').focus();},30);}
function closePwd(){document.getElementById('pwdBg').classList.remove('open');document.getElementById('unlockBtn').focus();}
async function sha(s){var b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));return Array.from(new Uint8Array(b)).map(function(x){return x.toString(16).padStart(2,'0');}).join('');}
async function submitPwd(){
  var e=document.getElementById('pwdErr');
  if(fails>=3){e.textContent='錯誤太多次，請重新整理頁面再試。';e.classList.remove('hide');return;}
  if(await sha(document.getElementById('pwdIn').value)===HASH){
    unlocked=true;ls('massageExamAuth',HASH);document.getElementById('pwdBg').classList.remove('open');render();
    var m=document.getElementById('lockMsg');m.setAttribute('tabindex','-1');m.focus();
  }else{fails++;e.textContent='密碼不正確';e.classList.remove('hide');document.getElementById('pwdIn').value='';document.getElementById('pwdIn').focus();}
}
document.addEventListener('keydown',function(e){if(e.key==='Escape'&&document.getElementById('pwdBg').classList.contains('open'))closePwd();});
// 左右滑換題（沿用主頁 v63 手勢）：單指只認左右滑；TalkBack 兩指／旁白三指也可；
// 上下滑不攔；兩指張開縮放、螢幕邊緣返回手勢、選取文字中都不換題。往左滑＝下一題。
(function(){
  var startX=0,startY=0,startN=0,tracking=false,MIN=45,EDGE=20,fStart={},fLast={},t0=0,drag=false,vert=false,cardEl=null;
  function resetCard(anim){if(!cardEl)return;if(anim)cardEl.classList.add('snap');cardEl.style.transform='';cardEl.style.opacity='';cardEl=null;}
  function active(){return effLayout()==='cards'&&!document.getElementById('pwdBg').classList.contains('open');}
  function sameDir(){var sign=0;for(var k in fStart){if(!fLast[k])continue;var d=fLast[k].x-fStart[k].x;if(Math.abs(d)<MIN/2)return false;var sg=d<0?-1:1;if(sign&&sg!==sign)return false;sign=sg;}return sign!==0;}
  document.addEventListener('touchstart',function(e){
    tracking=false;drag=false;vert=false;resetCard(false);if(!active())return;
    t0=Date.now();
    var t=e.target.tagName;if(t==='INPUT'||t==='SELECT'||t==='TEXTAREA')return;
    startN=e.touches.length;startX=e.touches[0].clientX;startY=e.touches[0].clientY;fStart={};fLast={};
    for(var i=0;i<e.touches.length;i++){var q=e.touches[i];fStart[q.identifier]=fLast[q.identifier]={x:q.clientX,y:q.clientY};}
    if(startN===1&&(startX<EDGE||startX>window.innerWidth-EDGE))return;
    tracking=true;
  },{passive:true});
  document.addEventListener('touchmove',function(e){
    if(!tracking)return;if(e.touches.length>startN)startN=e.touches.length;
    for(var i=0;i<e.touches.length;i++){var q=e.touches[i];if(!fStart[q.identifier])fStart[q.identifier]={x:q.clientX,y:q.clientY};fLast[q.identifier]={x:q.clientX,y:q.clientY};}
    if(startN===1&&e.touches.length===1){
      var mx=e.touches[0].clientX-startX,my=e.touches[0].clientY-startY;
      if(!drag&&!vert){
        if(Math.abs(my)>12&&Math.abs(my)>=Math.abs(mx))vert=true;
        else if(Math.abs(mx)>12&&Math.abs(mx)>Math.abs(my)*1.3&&!(window.getSelection&&window.getSelection().toString())){
          drag=true;cardEl=document.querySelector('#cardsBox .card');
          if(cardEl)cardEl.classList.remove('snap','inL','inR');
        }
      }
      if(drag&&cardEl){
        cardEl.style.transform='translateX('+Math.round(canGo(mx<0?1:-1)?mx:mx*0.25)+'px)';
        cardEl.style.opacity=String(Math.max(.4,1-Math.abs(mx)/600));
      }
    }
    if(startN>=2&&sameDir()){var dx=e.touches[0].clientX-startX,dy=e.touches[0].clientY-startY;if(Math.abs(dx)>MIN&&Math.abs(dx)>Math.abs(dy)&&e.cancelable)e.preventDefault();}
  },{passive:false});
  document.addEventListener('touchend',function(e){
    if(!tracking)return;
    if(e.changedTouches)for(var j=0;j<e.changedTouches.length;j++){var c=e.changedTouches[j];fLast[c.identifier]={x:c.clientX,y:c.clientY};}
    if(e.touches&&e.touches.length>0)return;
    tracking=false;if(!active()){resetCard(false);return;}
    var endT=e.changedTouches&&e.changedTouches[0];if(!endT){resetCard(true);return;}
    var dx=endT.clientX-startX,dy=endT.clientY-startY,ax=Math.abs(dx),ay=Math.abs(dy);
    var sel=window.getSelection?window.getSelection().toString():'';if(sel){resetCard(true);return;}
    var ok=drag?(ax>=MIN||(ax>24&&Date.now()-t0<250)):(!vert&&ax>=MIN&&ax>=ay);
    if(startN>=2&&!sameDir())ok=false;
    var dir=dx<0?1:-1;
    if(!ok||!canGo(dir)){resetCard(true);return;}
    var still=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    if(drag&&cardEl&&!still){
      cardEl.classList.add('snap');cardEl.style.transform='translateX('+(dir>0?'-110%':'110%')+')';cardEl.style.opacity='0';cardEl=null;
      setTimeout(function(){goCard(dir);},130);
    }else{cardEl=null;goCard(dir);}
  },{passive:true});
  document.addEventListener('touchcancel',function(){tracking=false;resetCard(true);},{passive:true});
  // 鍵盤左右鍵換題（卡片版面；焦點在輸入框、下拉選單或按著修飾鍵時不攔）
  document.addEventListener('keydown',function(e){
    if(e.key!=='ArrowLeft'&&e.key!=='ArrowRight')return;
    if(e.altKey||e.ctrlKey||e.metaKey||e.shiftKey||e.defaultPrevented||!active())return;
    var t=e.target;if(t&&(t.tagName==='INPUT'||t.tagName==='SELECT'||t.tagName==='TEXTAREA'||t.isContentEditable))return;
    e.preventDefault();goCard(e.key==='ArrowRight'?1:-1);
  });
})();
(function init(){
  var g=document.querySelector('[aria-label="只看"]');
  COLS.forEach(function(c){var b=document.createElement('button');b.type='button';b.setAttribute('data-col',c.k);b.textContent=c.h;b.onclick=function(){setCol(c.k);};g.appendChild(b);});
  var j=document.getElementById('jump');
  DATA.topics.forEach(function(t){var o=document.createElement('option');o.value=t.num;o.textContent=t.num+' '+sn(t);j.appendChild(o);});
  window.matchMedia('(max-width: 820px)').addEventListener('change',function(){if(layout==='auto')render();});
  // 從主頁帶題號進來：summary.html#pin=12,35（可加 &at=35 指定先看哪一題）
  var hm=/^#pin=(\d{1,2})(?:,(\d{1,2}))?(?:&at=(\d{1,2}))?$/.exec(location.hash),fromHash=false;
  if(hm){
    var hp=[hm[1],hm[2]].filter(Boolean).map(function(x){return ('0'+x).slice(-2);}).filter(function(x,i,a){return topicOf(x)&&a.indexOf(x)===i;});
    if(hp.length){pins=hp;savePins();pcur=Math.max(0,pins.indexOf(('0'+(hm[3]||hp[0])).slice(-2)));fromHash=true;
      try{history.replaceState(null,'',location.pathname+location.search);}catch(e){}}
  }
  render();
  if(fromHash&&effLayout()==='cards'){var cb=document.getElementById('cardsBox');if(cb)cb.scrollIntoView({block:'start'});focusCard(0);}
  if('serviceWorker' in navigator){
    navigator.serviceWorker.register('sw.js').then(function(){return navigator.serviceWorker.ready;})
      .then(function(){showOffline();})
      .catch(function(){setOM('這個瀏覽器無法存到裝置，需要網路才能開。');document.getElementById('saveBtn').classList.add('hide');});
  }else{setOM('這個瀏覽器不支援離線存檔，需要網路才能開。');document.getElementById('saveBtn').classList.add('hide');}
  window.addEventListener('offline',function(){setOM('離線中，使用存檔');});
})();
function setOM(s){document.getElementById('offlineMsg').textContent=s;}
function showOffline(){
  var t=ls('summarySavedAt');
  setOM(navigator.onLine?('已離線存檔'+(t?' '+t:'')):'離線中，使用存檔');
}
function saveOffline(){
  var b=document.getElementById('saveBtn');
  if(!window.caches){setOM('這個瀏覽器不支援離線存檔。');return;}
  if(!navigator.onLine){setOM('目前沒有網路，無法更新存檔；裝置裡的舊存檔仍可使用。');return;}
  b.disabled=true;setOM('存檔中');
  caches.open('massage-exam-offline-v1').then(function(c){
    return Promise.all(['summary.html','index.html','./'].map(function(u){
      return fetch(u,{cache:'reload'}).then(function(r){if(!r.ok)throw new Error(u);return c.put(u,r);});
    }));
  }).then(function(){
    var d=new Date(),p=function(n){return ('0'+n).slice(-2);};
    ls('summarySavedAt',(d.getMonth()+1)+'/'+d.getDate()+' '+p(d.getHours())+':'+p(d.getMinutes()));
    showOffline();
  }).catch(function(){setOM('存檔失敗，請確認網路後再按一次。');}).then(function(){b.disabled=false;});
}
function renderQuick(){
  var q=document.getElementById('quickPanel');
  if(!unlocked){q.classList.add('hide');return;}
  q.classList.remove('hide');
  function pick(k){return DATA.topics.filter(function(t){return t.pet&&t.pet[k]&&t.pet[k].length;});}
  function line(name,arr,k,open){
    var body='<ul class="plain">'+arr.map(function(t){return '<li><strong>'+t.num+' '+esc(t.name.replace(/之按摩$/,''))+'</strong>：'+t.pet[k].map(function(x){return esc(typeof x==='string'?x:x.text);}).join('；')+'</li>';}).join('')+'</ul>';
    return '<details'+(open?' open':'')+'><summary>'+name+'</summary>'+body+'</details>';
  }
  q.innerHTML='<h2>比對</h2>'+line('墊枕',pick('pillow'),'pillow',true)+line('測試／檢查',pick('tests'),'tests',false)+line('運動法',pick('exercises'),'exercises',false)+line('擦法',pick('rub'),'rub',false)+line('設定（設患側、壓痛點、型別）',pick('setup'),'setup',false);
}
